name: Build Dare Android APK

# Manually triggered: builds the native Dare Android app (mobile/dare-android)
# on a GitHub-hosted runner, which has full internet access to the Android
# SDK / Google's Maven repository — unlike the sandbox this app's source was
# originally written in. Produces real, installable .apk files as workflow
# artifacts.
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "What to build"
        required: true
        default: "both"
        type: choice
        options: [debug, release, both]
  # workflow_dispatch only runs for workflows present on the default branch,
  # so a push trigger is included too - it works on any branch and lets this
  # first build run straight from the feature branch this app was built on.
  push:
    branches:
      - "claude/chengetai-website-vision-kni1k1"
    paths:
      - "mobile/dare-android/**"
      - ".github/workflows/build-dare-android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # inputs.* only exists for workflow_dispatch events; a push event has no
    # inputs at all, so default to building both APKs in that case.
    env:
      BUILD_TYPE: ${{ (github.event_name == 'workflow_dispatch' && inputs.build_type) || 'both' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/dare-android/package-lock.json

      - name: Install npm dependencies
        working-directory: mobile/dare-android
        run: npm ci

      # capacitor-cordova-android-plugins/ is gitignored by Capacitor's own
      # template (it's a generated module, not source) - `cap sync` rebuilds
      # it, along with assets/public and capacitor.config.json, from
      # node_modules. Without this the Gradle build fails looking for
      # android/capacitor-cordova-android-plugins/cordova.variables.gradle.
      - name: Capacitor sync
        working-directory: mobile/dare-android
        run: npx cap sync android

      - name: Grant execute permission for gradlew
        working-directory: mobile/dare-android/android
        run: chmod +x ./gradlew

      # ── Debug build ────────────────────────────────────────────────────
      - name: Build debug APK
        if: ${{ env.BUILD_TYPE == 'debug' || env.BUILD_TYPE == 'both' }}
        working-directory: mobile/dare-android/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        if: ${{ env.BUILD_TYPE == 'debug' || env.BUILD_TYPE == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: dare-debug-apk
          path: mobile/dare-android/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # ── Release build ──────────────────────────────────────────────────
      # Reuses a keystore from repository secrets if one has been configured
      # (DARE_KEYSTORE_BASE64 / DARE_KEYSTORE_PASSWORD / DARE_KEY_ALIAS /
      # DARE_KEY_PASSWORD); otherwise generates a fresh one for this build and
      # uploads it as an artifact so it can be reused for every future update.
      - name: Prepare release keystore
        if: ${{ env.BUILD_TYPE == 'release' || env.BUILD_TYPE == 'both' }}
        working-directory: mobile/dare-android/android/app
        env:
          EXISTING_KEYSTORE_B64: ${{ secrets.DARE_KEYSTORE_BASE64 }}
          EXISTING_STORE_PASSWORD: ${{ secrets.DARE_KEYSTORE_PASSWORD }}
          EXISTING_KEY_ALIAS: ${{ secrets.DARE_KEY_ALIAS }}
          EXISTING_KEY_PASSWORD: ${{ secrets.DARE_KEY_PASSWORD }}
        run: |
          if [ -n "$EXISTING_KEYSTORE_B64" ]; then
            echo "Reusing existing keystore from repository secrets."
            echo "$EXISTING_KEYSTORE_B64" | base64 -d > dare-release.keystore
            echo "STORE_PASSWORD=$EXISTING_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$EXISTING_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$EXISTING_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "FRESH_KEYSTORE=false" >> "$GITHUB_ENV"
          else
            echo "No repository secrets configured — generating a NEW keystore for this build."
            # PKCS12 (the JDK 21 default keystore format) ties the store
            # password and each key's password together - keytool accepts
            # different values for -storepass/-keypass without erroring, but
            # the key silently ends up encrypted with the store password,
            # so reading it back with a separate key password later fails
            # ("Given final block not properly padded"). Use one password
            # for both to avoid that.
            KEYSTORE_PW=$(openssl rand -base64 24)
            echo "::add-mask::$KEYSTORE_PW"
            keytool -genkeypair -v -keystore dare-release.keystore -alias dare \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KEYSTORE_PW" -keypass "$KEYSTORE_PW" \
              -dname "CN=ChengetAI Labs, OU=Dare, O=ChengetAI Labs, L=Harare, C=ZW"
            echo "STORE_PASSWORD=$KEYSTORE_PW" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=dare" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KEYSTORE_PW" >> "$GITHUB_ENV"
            echo "FRESH_KEYSTORE=true" >> "$GITHUB_ENV"
            {
              echo "New release keystore generated for the Dare Android app."
              echo "SAVE THIS FILE AND THE PASSWORD BELOW SOMEWHERE SAFE."
              echo ""
              echo "Store password: $KEYSTORE_PW"
              echo "Key alias:      dare"
              echo "Key password:   (same as store password)"
              echo ""
              echo "Every future update to this app MUST be signed with this same"
              echo "keystore, or Android will refuse to install it over the existing"
              echo "app (users would have to uninstall the old one first)."
              echo ""
              echo "To make future workflow runs reuse this identity automatically,"
              echo "add these as repository secrets (Settings -> Secrets and variables"
              echo "-> Actions -> New repository secret):"
              echo "  DARE_KEYSTORE_BASE64   = base64 -w0 dare-release.keystore"
              echo "  DARE_KEYSTORE_PASSWORD = $KEYSTORE_PW"
              echo "  DARE_KEY_ALIAS         = dare"
              echo "  DARE_KEY_PASSWORD      = $KEYSTORE_PW"
            } > dare-release-keystore-INFO.txt
          fi

      - name: Build release APK
        if: ${{ env.BUILD_TYPE == 'release' || env.BUILD_TYPE == 'both' }}
        working-directory: mobile/dare-android/android
        run: |
          ./gradlew assembleRelease --no-daemon \
            -PRELEASE_STORE_FILE=dare-release.keystore \
            -PRELEASE_STORE_PASSWORD="$STORE_PASSWORD" \
            -PRELEASE_KEY_ALIAS="$KEY_ALIAS" \
            -PRELEASE_KEY_PASSWORD="$KEY_PASSWORD"

      - name: Upload release APK
        if: ${{ env.BUILD_TYPE == 'release' || env.BUILD_TYPE == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: dare-release-apk
          path: mobile/dare-android/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload freshly generated keystore (first run only)
        if: ${{ (env.BUILD_TYPE == 'release' || env.BUILD_TYPE == 'both') && env.FRESH_KEYSTORE == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: dare-release-keystore-SAVE-THIS
          path: |
            mobile/dare-android/android/app/dare-release.keystore
            mobile/dare-android/android/app/dare-release-keystore-INFO.txt
          if-no-files-found: error
