<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="ChengetAi Labs">
  <defs>
    <linearGradient id="cg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2dd4a0"/>
      <stop offset="0.5" stop-color="#a3e635"/>
      <stop offset="1" stop-color="#f5b841"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.32" cy="0.22" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Shield: "chengeta" — to keep, to protect -->
  <path d="M24 2.2 42 9V23c0 11.2-7.5 19.1-18 22.8C13.5 42.1 6 34.2 6 23V9Z" fill="url(#cg)"/>
  <!-- top light + inner rim for depth -->
  <path d="M24 2.2 42 9V23c0 11.2-7.5 19.1-18 22.8C13.5 42.1 6 34.2 6 23V9Z" fill="url(#glow)"/>
  <path d="M24 4.4 40 10.4V23c0 10-6.7 17.1-16 20.5C14.7 40.1 8 33 8 23V10.4Z"
        fill="none" stroke="url(#rim)" stroke-width="1.4"/>

  <!-- C arc with connected node -->
  <path d="M30.6 18.2a8.8 8.8 0 1 0 0 11.6" fill="none" stroke="#071409" stroke-width="4.8" stroke-linecap="round"/>
  <circle cx="32.3" cy="24" r="2.8" fill="#071409"/>
  <!-- AI spark above the node -->
  <path d="M35.4 13.2l0.85 2.15 2.15 0.85-2.15 0.85-0.85 2.15-0.85-2.15-2.15-0.85 2.15-0.85Z" fill="#071409" opacity="0.85"/>
</svg>
